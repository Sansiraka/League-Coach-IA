services:
  db:
    image: postgres:15-alpine
    container_name: coach_db
    restart: always
    environment:
      POSTGRES_USER: coach_user
      POSTGRES_PASSWORD: coach_password
      POSTGRES_DB: coach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach_user -d coach_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: coach_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://coach_user:coach_password@db:5432/coach_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: coach_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
